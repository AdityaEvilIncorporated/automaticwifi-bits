# Builds and publishes a GitHub Release for a v* tag: Android APK (signed with the release key
# from secrets), desktop binaries for macOS/Windows/Linux, and SHA256SUMS.txt. Every test suite
# runs first; nothing is published if one fails.
#
# Secrets (repository settings, never in the repo):
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the reviewed-commit check below needs dev's history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # The ubuntu runner image ships the Android SDK (ANDROID_HOME, accepted licences); AGP
      # downloads any missing platform/build-tools itself. No third-party setup action.
      - name: Android SDK present
        run: |
          [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ] || { echo "::error::ANDROID_HOME not set on this runner"; exit 1; }
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 6

      # Runs before any secret is in scope: a well-formed tag (it feeds shell arithmetic and
      # -ldflags), equal to RELEASE_TAG (the download page links it), on a commit already on dev
      # (so a tag pushed on an unreviewed branch never gets the signing key).
      - name: Check the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag $GITHUB_REF_NAME"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || { echo "::error::$GITHUB_SHA is not on dev"; exit 1; }
          want=$(tr -d '[:space:]' < RELEASE_TAG)
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but RELEASE_TAG says $want: update RELEASE_TAG and site/index.html first"
            exit 1
          fi

      - name: Kotlin core tests (shared cases + mock portal)
        run: |
          mkdir -p .build
          CGO_ENABLED=0 go build -o .build/mockportal ./cmd/mockportal
          cd android
          MOCKPORTAL_BIN="$PWD/../.build/mockportal" ./gradlew --no-daemon -q :core:test

      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: refusing to publish a debug-signed APK"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK (app unit tests + lint + signed release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          IFS=. read -r major minor patch <<< "$v"
          # 10#: base 10 even with leading zeros; minor/patch < 100 keeps codes unique and rising
          (( 10#$minor < 100 && 10#$patch < 100 )) || { echo "::error::minor and patch must be < 100"; exit 1; }
          export APP_VERSION_CODE=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          (( APP_VERSION_CODE > 0 )) || { echo "::error::v0.0.0 gives versionCode 0"; exit 1; }
          bash scripts/build-apk.sh

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk
          path: dist/autowifi-bits.apk
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: apk
    runs-on: macos-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test -race -count=1 ./...

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk
          path: dist

      - name: Build desktop assets
        run: bash scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Check assets
        run: |
          bash scripts/check-dist.sh "$GITHUB_REF_NAME"
          grep -q ' autowifi-bits.apk$' dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RELEASE_BETA (one line, the label) or a "-" in the tag makes this a pre-release.
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          if [ -f RELEASE_BETA ]; then
            label=$(head -n 1 RELEASE_BETA)
            args=(--verify-tag --generate-notes --prerelease --title "$GITHUB_REF_NAME ($label)")
            owner=${GITHUB_REPOSITORY%%/*}; name=${GITHUB_REPOSITORY#*/}
            page="https://$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]').github.io/$name/#campus-checklist"
            printf '**%s.** Tested against a simulated FortiGate portal only.\nBefore relying on it, run the campus verification checklist: %s\n\n' "$label" "$page" > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}" --notes-file "$notes"
