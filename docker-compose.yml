# Local services for development and tests. Values come from .env (generated by bs-env.py).
# db always runs; the others start only when listed in COMPOSE_PROFILES in .env
# (prep picks them from the spec; add one with: bs-env.py . --add-profile storage).
# Everything binds to 127.0.0.1 and holds no real data. Claude adds the app service during planning.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${DB_PORT}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20
  mail:            # catches all email; tests read it from ${MAILPIT_URL}/api/v1/messages
    profiles: [mail]
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${SMTP_PORT}:1025", "127.0.0.1:${MAILPIT_PORT}:8025"]
  storage:         # S3 API (MinIO's free images were withdrawn in 2025-26); VERIFY flags on SeaweedFS docs
    profiles: [storage]
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -dir=/data -s3.port=8333"
    ports: ["127.0.0.1:${S3_PORT}:8333"]
    volumes: [s3data:/data]
  cache:
    profiles: [cache]
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT}:6379"]
  oauth:           # mock OpenID Connect provider: any username logs in. VERIFY the tag on github.com/navikt/mock-oauth2-server
    profiles: [oauth]
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports: ["127.0.0.1:${OAUTH_PORT}:8080"]
  payments:        # Stripe's official API mock: stateless, no account, key sk_test_local
    profiles: [payments]
    image: stripe/stripe-mock:latest
    ports: ["127.0.0.1:${STRIPE_MOCK_PORT}:12111"]
volumes:
  dbdata:
  s3data:
